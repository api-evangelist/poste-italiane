aid: poste-italiane

name: Poste Italiane

description: 'Poste Italiane (Gruppo Poste Italiane S.p.A.) is Italy''s national postal operator and largest integrated
  omnichannel services platform, active in logistics, mail and parcels, financial services (BancoPosta), insurance
  (Poste Vita, Poste Assicura), payments and telecommunications. Its parcel carrier API for Poste Delivery Business
  (Delivery Express) is available only to contracted business customers via the MyPDB portal; no public developer
  documentation or machine-readable contract is published. Surfaced via the API Evangelist harvest backlog
  (market-gap:shipping-logistics).'

